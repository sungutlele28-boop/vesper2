<title>Vesper – Local music player</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--blur:36px;--dim:.55;--ease:cubic-bezier(.2,.9,.2,1)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#000;color:#fff;font-family:ui-sans-serif,"SF Pro Display",Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.f{fill:currentColor}
/* backdrop */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#000}
#bg i{position:absolute;inset:-12%;background:center/cover;opacity:0;transition:opacity 1.4s ease;filter:blur(var(--blur));animation:drift 40s ease-in-out infinite alternate}
#bg i.on{opacity:1}
body.mono #bg i{filter:blur(var(--blur)) grayscale(1)}
#dim{position:fixed;inset:0;z-index:1;background:rgba(0,0,0,var(--dim));transition:background .3s}
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.14;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@keyframes drift{to{transform:scale(1.12) translate(2%,-2%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@keyframes ring{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(1.55)}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
/* layout */
#app{position:relative;z-index:2;height:100%;max-width:1100px;margin:0 auto;padding:10px 20px 16px;display:flex;flex-direction:column}
header{height:40px;display:flex;align-items:center;flex:none}
.brand{font-weight:700;letter-spacing:.04em;display:flex;gap:10px;align-items:center}
.brand b{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 16px #fff}
#player{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:14px}
#app.empty #player,#app:not(.empty) #empty{display:none}
#artwrap{--s:min(84vw,38vh);position:relative;width:var(--s);height:var(--s);margin:auto 0;flex:none;transform:scale(.88);transition:transform .8s var(--ease)}
body.playing #artwrap{transform:none}
#glow{position:absolute;inset:6%;border-radius:40%;background:center/cover;filter:blur(46px);opacity:calc(.35 + var(--pulse,0)*.65);transform:scale(calc(1.05 + var(--pulse,0)*.14));transition:opacity .1s linear}
body.mono #glow{filter:blur(46px) grayscale(1)}
#art{position:relative;width:100%;height:100%;border-radius:32px;background:#161616 center/cover;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);overflow:hidden;display:grid;place-items:center;transition:border-radius .6s var(--ease)}
body.mono #art{filter:grayscale(1)}
#art .i{width:30%;height:30%;stroke-width:1.2;opacity:.25}
#art:not(.noart) .i,#art.vinyl .i{display:none}
#art .gr,#art .hole{display:none;position:absolute;border-radius:50%}
#art.vinyl{border-radius:50%;animation:spin 18s linear infinite;animation-play-state:paused}
body.playing #art.vinyl{animation-play-state:running}
#art.vinyl .gr{display:block;inset:0;background:repeating-radial-gradient(circle,transparent 0 2px,rgba(0,0,0,.3) 2px 3px),conic-gradient(from 20deg,rgba(255,255,255,.16),transparent 20%,transparent 50%,rgba(255,255,255,.16) 70%,transparent)}
#art.vinyl .hole{display:block;inset:42%;background:#0a0a0a;border:4px solid rgba(255,255,255,.85)}
.panel{width:100%;max-width:520px;flex:none;border-radius:32px;padding:20px 22px 14px;transition:background .4s,border-color .4s}
body.glass .panel{background:rgba(18,18,18,.5);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.meta{text-align:center;animation:in .5s var(--ease)}
.meta h1{margin:0;font-size:clamp(22px,5vw,30px);font-weight:700;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin:4px 0 0;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:10px 0 0;cursor:pointer}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.18) var(--p,0%))}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;transform:scale(0);transition:transform .2s}
.seek:hover::-webkit-slider-thumb,.seek:active::-webkit-slider-thumb,.seek:focus-visible::-webkit-slider-thumb,.set .seek::-webkit-slider-thumb{transform:scale(1)}
.seek::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
.seek::-moz-range-progress{height:4px;border-radius:4px;background:#fff}
.seek::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;margin-top:-2px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.cb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;position:relative;color:rgba(255,255,255,.5);transition:color .2s,transform .15s}
.cb:hover,.cb.on{color:#fff}.cb:active{transform:scale(.86)}
.cb.on::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:#fff}
.cb.m{color:#fff;width:60px;height:60px}
#pp{position:relative;width:80px;height:80px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 10px 40px rgba(255,255,255,.16);transition:transform .15s,box-shadow .5s}
#pp:active{transform:scale(.9)}
body.playing #pp{box-shadow:0 10px 56px rgba(255,255,255,.32)}
#pp::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.55);opacity:0}
body.playing #pp::before{animation:ring 2.4s ease-out infinite}
.dock{display:flex;justify-content:center;gap:8px;padding-top:12px;flex:none}
.pill{height:46px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:background .2s,transform .15s}
.pill:hover{background:rgba(255,255,255,.16)}.pill:active{transform:scale(.94)}
.pill.solid{background:#fff;color:#000;border-color:#fff}.pill.solid:hover{background:#e6e6e6}
.pill .i{width:18px;height:18px}
/* empty state */
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.disc{position:relative;width:min(58vw,250px);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#0d0d0d 0 2px,#1c1c1c 2px 3px);box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.1);animation:spin 22s linear infinite}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,rgba(255,255,255,.18),transparent 22%,transparent 52%,rgba(255,255,255,.18) 72%,transparent)}
.disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:#f2f2f2;box-shadow:inset 0 0 0 10px #0a0a0a}
#empty h1{margin:0;font-size:clamp(24px,6vw,34px);letter-spacing:-.03em}
#empty p{margin:0;max-width:300px;color:rgba(255,255,255,.55);line-height:1.5}
/* drawers */
.drawer{position:fixed;z-index:20;left:0;right:0;bottom:0;height:78%;display:flex;flex-direction:column;background:rgba(12,12,12,.82);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.1);border-radius:30px 30px 0 0;transform:translateY(105%);transition:transform .5s var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
@media(min-width:900px){
 .drawer{left:auto;top:16px;right:16px;bottom:16px;height:auto;width:380px;border-radius:30px;transform:translateX(115%)}
 #player{flex-direction:row;justify-content:center;gap:64px}
 #artwrap{--s:min(540px,68vh,calc(100vw - 600px))}
 .panel{width:420px}.meta{text-align:left}
}
#scrim{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .4s}
#scrim.on{opacity:1;pointer-events:auto}
.dh{display:flex;align-items:center;justify-content:space-between;padding:20px 14px 8px 22px}
.dh h2{margin:0;font-size:20px;letter-spacing:-.02em}.dh small{color:rgba(255,255,255,.5);font-size:13px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.6);transition:background .2s,color .2s,transform .15s}
.ib:hover{background:rgba(255,255,255,.1);color:#fff}.ib:active{transform:scale(.88)}
.ql{list-style:none;margin:0;padding:4px 10px 14px;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:#333 transparent}
.q{display:flex;align-items:center;border-radius:18px;transition:background .2s}
.q:hover{background:rgba(255,255,255,.06)}.q.cur{background:rgba(255,255,255,.1)}
.q .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px;text-align:left}
.th{width:46px;height:46px;border-radius:12px;background:#1a1a1a center/cover;flex:none}
body.mono .th{filter:grayscale(1)}
.tx{min-width:0;flex:1;display:flex;flex-direction:column}
.tx b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{font-size:12px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px;margin-right:4px}
.eq i{width:3px;height:14px;background:#fff;border-radius:2px;transform-origin:bottom;animation:eq .9s ease-in-out infinite;animation-play-state:paused;transform:scaleY(.3)}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
body.playing .eq i{animation-play-state:running}
.none{padding:40px 20px;text-align:center;color:rgba(255,255,255,.45)}
.set{padding:6px 22px 24px;overflow-y:auto;flex:1}
.set h3{margin:18px 0 10px;font-size:13px;font-weight:600;color:rgba(255,255,255,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.08);font-size:14px;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}.chip[aria-pressed=true]{background:#fff;color:#000}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:15px}
.sl{display:flex;align-items:center;gap:12px;font-size:14px}.sl span{width:44px;color:rgba(255,255,255,.6)}.sl .seek{margin:0}
.sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.14);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s var(--ease),background .25s}
.sw[aria-pressed=true]{background:#fff}.sw[aria-pressed=true]::after{background:#000;transform:translateX(20px)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],B=document.body;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{if(!isFinite(s)||s<0)return'0:00';s|=0;return(s/60|0)+':'+String(s%60).padStart(2,'0')};
const parse=n=>{const b=n.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim(),m=b.split(/\s[-–]\s/);return m.length>1?{artist:m[0].trim(),title:m.slice(1).join(' – ').trim()}:{title:b,artist:'Unknown artist'}};

/* settings (persisted on this device) */
let cfg={bg:'art',blur:36,dim:55,vinyl:false,mono:true,glass:true},wall=null;
try{Object.assign(cfg,JSON.parse(localStorage.getItem('vesper-cfg')||'{}'));wall=localStorage.getItem('vesper-wall')}catch(e){}
const save=()=>{try{localStorage.setItem('vesper-cfg',JSON.stringify(cfg))}catch(e){}};
const PRE={void:'radial-gradient(70% 55% at 50% 0%,#262626,#000 75%)',mist:'radial-gradient(45% 40% at 18% 22%,#4a4a4a,transparent 70%),radial-gradient(50% 45% at 82% 75%,#363636,transparent 70%),#0a0a0a'};
let bgv='',flip=0;
function paintBg(){
  const t=T[I];let v;
  if(cfg.bg==='wall'&&wall)v=`url("${wall}")`;
  else if(cfg.bg==='art'&&t&&t.art)v=`url("${t.art}")`;
  else v=PRE[cfg.bg==='mist'?'mist':'void'];
  if(v===bgv)return;bgv=v;
  const L=$$('#bg i');flip^=1;L[flip].style.backgroundImage=v;L[flip].classList.add('on');L[flip^1].classList.remove('on');
}
function apply(){
  const r=document.documentElement.style;
  r.setProperty('--blur',cfg.blur+'px');r.setProperty('--dim',cfg.dim/100);
  B.classList.toggle('mono',cfg.mono);B.classList.toggle('glass',cfg.glass);
  $('#art').classList.toggle('vinyl',cfg.vinyl);
  $$('[data-bg]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.bg===cfg.bg));
  $$('[data-art]').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.art==='vinyl')===cfg.vinyl));
  $('#sw-glass').setAttribute('aria-pressed',cfg.glass);$('#sw-mono').setAttribute('aria-pressed',cfg.mono);
  const b=$('#blur'),d=$('#dim2');b.value=cfg.blur;d.value=cfg.dim;
  b.style.setProperty('--p',cfg.blur/80*100+'%');d.style.setProperty('--p',cfg.dim/90*100+'%');
  paintBg();
}
function setWall(file){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    wall=c.toDataURL('image/jpeg',.78);try{localStorage.setItem('vesper-wall',wall)}catch(e){}
    cfg.bg='wall';save();apply();
  };im.src=fr.result};
  fr.readAsDataURL(file);
}

/* audio engine: one persistent element */
const A=new Audio();A.preload='metadata';
let T=[],I=-1,uid=1,shuf=false,rep=0,want=false,drag=false,ac,an,raf;
const fd=new Uint8Array(128);
function ctx(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.82;ac.createMediaElementSource(A).connect(an);an.connect(ac.destination)}catch(e){ac=null}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function viz(){
  cancelAnimationFrame(raf);const w=$('#artwrap');
  const f=()=>{let p=0;if(an&&!A.paused){an.getByteFrequencyData(fd);for(let i=1;i<6;i++)p+=fd[i];p=(p/5/255)**2}
    w.style.setProperty('--pulse',p.toFixed(3));if(!A.paused)raf=requestAnimationFrame(f)};f();
}
function paint(c){
  const d=A.duration||0,s=$('#seek');s.max=d;s.value=c;s.style.setProperty('--p',d?c/d*100+'%':'0%');
  $('#tc').textContent=fmt(c);$('#td').textContent=fmt(d);
}
A.onplay=()=>{ctx();B.classList.add('playing');$('#ppi').setAttribute('href','#i-pause');$('#pp').setAttribute('aria-label','Pause');viz()};
A.onpause=()=>{B.classList.remove('playing');$('#ppi').setAttribute('href','#i-play');$('#pp').setAttribute('aria-label','Play');if(!A.ended)want=false};
A.ontimeupdate=()=>{if(!drag)paint(A.currentTime)};
A.onloadedmetadata=A.ondurationchange=()=>paint(A.currentTime);
A.onended=()=>next(true);
A.onerror=()=>{if(A.getAttribute('src'))next(true)};

function load(){
  const t=T[I];
  if(t){A.src=t.url;if(want)A.play().catch(()=>{})}else{A.removeAttribute('src');A.load();paint(0)}
  show();
}
function go(n){want=true;if(n===I){A.currentTime=0;A.play().catch(()=>{})}else{I=n;load()}}
function next(auto){
  if(!T.length)return;
  if(auto&&rep===2){A.currentTime=0;A.play();return}
  let n;
  if(shuf&&T.length>1){do{n=Math.random()*T.length|0}while(n===I)}else n=I+1;
  if(n>=T.length){if(rep===1||!auto)n=0;else{want=false;A.pause();A.currentTime=0;return}}
  go(n);
}
function prev(){if(!T.length)return;if(A.currentTime>3)A.currentTime=0;else go((I-1+T.length)%T.length)}
function toggle(){if(!T.length){$('#f').click();return}if(A.paused){want=true;A.play().catch(()=>{})}else A.pause()}

function show(){
  const t=T[I],art=$('#art'),m=$('#meta');
  $('#app').classList.toggle('empty',!t);
  if(t){
    $('#ttl').textContent=t.title;$('#sub').textContent=t.artist;
    const u=t.art?`url("${t.art}")`:'none';
    art.style.backgroundImage=u;$('#glow').style.backgroundImage=t.art?u:'radial-gradient(circle,#777,transparent 70%)';
    art.classList.toggle('noart',!t.art);
    m.style.animation='none';m.offsetWidth;m.style.animation='';
    document.title=t.title+' – Vesper';
    if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,artwork:t.art?[{src:t.art}]:[]});
  }else document.title='Vesper – Local music player';
  paintBg();queue();
}
function queue(){
  $('#qn').textContent=T.length;$('#dockn').textContent=T.length||'';
  $('#ql').innerHTML=T.length?T.map((t,j)=>`<li class="q${j===I?' cur':''}"><button class="main" data-p="${j}" aria-label="Play ${esc(t.title)}"><i class="th" style="${t.art?`background-image:url('${t.art}')`:''}"></i><span class="tx"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></span>${j===I?'<span class="eq"><i></i><i></i><i></i></span>':''}</button><button class="ib" data-d="${j}" aria-label="Remove ${esc(t.title)}"><svg class="i" width="18" height="18"><use href="#i-trash"/></svg></button></li>`).join(''):'<li class="none">Your queue is empty.</li>';
}
function add(files){
  const fs=[...files].filter(f=>/\.(mp3|flac|m4a|wav|aac|ogg|opus)$/i.test(f.name)||f.type.startsWith('audio/'));
  if(!fs.length)return;
  const n=fs.map(f=>({id:uid++,url:URL.createObjectURL(f),art:null,...parse(f.name)})),first=I<0;
  T.push(...n);
  if(first){want=true;I=0;load()}else queue();
  if(window.jsmediatags)fs.forEach((f,i)=>{try{jsmediatags.read(f,{onSuccess:({tags})=>{
    const t=T.find(x=>x.id===n[i].id);if(!t)return;
    if(tags.title)t.title=tags.title;if(tags.artist)t.artist=tags.artist;
    if(tags.picture)t.art=URL.createObjectURL(new Blob([new Uint8Array(tags.picture.data)],{type:tags.picture.format}));
    T[I]===t?show():queue();
  },onError:()=>{}})}catch(e){}});
}
function remove(j){
  const t=T[j];URL.revokeObjectURL(t.url);if(t.art)URL.revokeObjectURL(t.art);T.splice(j,1);
  if(!T.length){want=false;I=-1;load()}
  else if(j<I){I--;queue()}
  else if(j===I){I=Math.min(j,T.length-1);load()}
  else queue();
}
function drawer(id){
  const d=id&&$('#'+id),was=d&&d.classList.contains('open');
  $$('.drawer').forEach(x=>x.classList.remove('open'));
  if(d&&!was)d.classList.add('open');$('#scrim').classList.toggle('on',!!(d&&!was));
}

/* wiring */
$('#pp').onclick=toggle;$('#pv').onclick=prev;$('#nx').onclick=()=>next(false);
$('#sh').onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle('on',shuf);e.currentTarget.setAttribute('aria-pressed',shuf)};
$('#rp').onclick=e=>{rep=(rep+1)%3;e.currentTarget.classList.toggle('on',rep>0);$('#rpi').setAttribute('href',rep===2?'#i-repeat1':'#i-repeat');e.currentTarget.setAttribute('aria-label','Repeat: '+['off','all','one'][rep])};
$('#add').onclick=$('#addE').onclick=()=>$('#f').click();
$('#f').onchange=e=>{add(e.target.files);e.target.value=''};
$('#dq').onclick=()=>drawer('queue');$('#ds').onclick=()=>drawer('look');
$('#scrim').onclick=()=>drawer();$$('[data-close]').forEach(b=>b.onclick=()=>drawer());
$('#clr').onclick=()=>{while(T.length)remove(T.length-1);drawer()};
$('#ql').onclick=e=>{
  const p=e.target.closest('[data-p]'),d=e.target.closest('[data-d]');
  if(p){go(+p.dataset.p);if(matchMedia('(max-width:899px)').matches)drawer()}else if(d)remove(+d.dataset.d);
};
const sk=$('#seek');
sk.onpointerdown=()=>drag=true;sk.onpointerup=()=>drag=false;
sk.oninput=()=>paint(+sk.value);sk.onchange=()=>{A.currentTime=+sk.value;drag=false};

$$('[data-bg]').forEach(b=>b.onclick=()=>{if(b.dataset.bg==='wall'&&!wall){$('#wf').click();return}cfg.bg=b.dataset.bg;save();apply()});
$$('[data-art]').forEach(b=>b.onclick=()=>{cfg.vinyl=b.dataset.art==='vinyl';save();apply()});
$('#up').onclick=()=>$('#wf').click();
$('#wf').onchange=e=>{if(e.target.files[0])setWall(e.target.files[0]);e.target.value=''};
$('#blur').oninput=e=>{cfg.blur=+e.target.value;save();apply()};
$('#dim2').oninput=e=>{cfg.dim=+e.target.value;save();apply()};
$('#sw-glass').onclick=()=>{cfg.glass=!cfg.glass;save();apply()};
$('#sw-mono').onclick=()=>{cfg.mono=!cfg.mono;save();apply()};

addEventListener('keydown',e=>{
  if(e.key==='Escape')drawer();
  if(/BUTTON|INPUT/.test(e.target.tagName))return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  if(e.code==='ArrowRight')A.currentTime=Math.min(A.duration||0,A.currentTime+5);
  if(e.code==='ArrowLeft')A.currentTime=Math.max(0,A.currentTime-5);
});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();add(e.dataTransfer.files)});
if('mediaSession' in navigator)for(const[k,f]of Object.entries({play:toggle,pause:()=>A.pause(),previoustrack:prev,nexttrack:()=>next(false)}))try{navigator.mediaSession.setActionHandler(k,f)}catch(e){}

apply();show();
</script>
<script type="text/plain" id="vesper-sw">
/* Vesper service worker – app shell, offline-first. Save next to the HTML as sw.js */
const V = 'vesper-v1';
const EXT = ['https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js'];

self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(V)
      .then(c => Promise.all([
        c.add('./').catch(() => {}),
        ...EXT.map(u => c.add(new Request(u, { mode: 'no-cors' })).catch(() => {}))
      ]))
      .then(() => self.skipWaiting())
  );
});

self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys()
      .then(keys => Promise.all(keys.filter(k => k !== V).map(k => caches.delete(k))))
      .then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', e => {
  const r = e.request;
  if (r.method !== 'GET') return;
  const u = new URL(r.url);
  if (u.origin !== location.origin && u.hostname !== 'cdnjs.cloudflare.com') return;

  // pages: network first, fall back to the cached copy when offline
  if (r.mode === 'navigate') {
    e.respondWith(
      fetch(r)
        .then(res => { const cp = res.clone(); caches.open(V).then(c => c.put(r, cp)); return res; })
        .catch(() => caches.match(r).then(m => m || caches.match('./')))
    );
    return;
  }
  // everything else: cache first, refresh in the background
  e.respondWith(
    caches.match(r).then(hit => {
      const net = fetch(r)
        .then(res => {
          if (res.ok || res.type === 'opaque') { const cp = res.clone(); caches.open(V).then(c => c.put(r, cp)); }
          return res;
        })
        .catch(() => hit);
      return hit || net;
    })
  );
});
</script>
<script>
/* PWA: registers ./sw.js (the text above, saved as a file beside this HTML). Needs HTTPS or localhost. */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
